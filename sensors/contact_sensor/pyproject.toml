[project]
name = "contact_sensor"
version = "0.1.0"
description = "Polyflow Contact Sensor sensor node"
license = "MIT"
authors = [
    {name = "Drew Swinney", email = "drew@polyflowrobotics.com"},
]
maintainers = [
    {name = "Drew Swinney", email = "drew@polyflowrobotics.com"},
]
dependencies = ["setuptools"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.data-files]
"share/ament_index/resource_index/packages" = ["resource/contact_sensor"]
"share/contact_sensor" = ["package.xml"]

[project.scripts]
contact_sensor_node = "contact_sensor.node:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
