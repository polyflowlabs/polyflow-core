[project]
name = "gripper_command"
version = "0.1.0"
description = "Polyflow utility node — turns a button into a gripper open/closed position"
license = "MIT"
authors = [
    {name = "Drew Swinney", email = "drew@polyflowrobotics.com"},
]
maintainers = [
    {name = "Drew Swinney", email = "drew@polyflowrobotics.com"},
]
dependencies = ["setuptools"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.data-files]
"share/ament_index/resource_index/packages" = ["resource/gripper_command"]
"share/gripper_command" = ["package.xml"]

[project.scripts]
gripper_command_node = "gripper_command.node:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
