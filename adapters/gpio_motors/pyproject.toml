[project]
name = "polyflow-gpio-motors-adapter"
version = "0.1.0"
description = "Polyflow hardware adapter for motor drivers on a Raspberry Pi's GPIO: TB6612FNG DC motors, StepStick steppers, hobby servos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Polyflow Robotics" }]

dependencies = [
    "polyflow-adapter-sdk>=0.1.0",
    "lgpio>=0.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
