[project]
name = "polyflow-pca9685-adapter"
version = "0.1.0"
description = "Polyflow hardware adapter for PCA9685 16-channel PWM servo HATs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Polyflow Robotics" }]

dependencies = [
    "polyflow-adapter-sdk>=0.1.0",
    "smbus2>=0.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
